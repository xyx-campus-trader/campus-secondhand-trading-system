<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园二手交易平台</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #E0F2FE 0%, #F3F4F6 100%);
            padding: 2rem 0;
        }

        .auth-card {
            width: 100%;
            max-width: 480px;
            padding: 2rem;
        }

        .auth-logo {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .auth-logo img {
            width: 50px;
            height: 50px;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <div class="card auth-card">
            <div class="auth-logo">
                <img src="images/logo.png" alt="Logo">
            </div>
            <h2 class="text-2xl mb-4 text-center">创建账号</h2>

            <form id="registerForm">
                <div class="form-group">
                    <label class="form-label">用户名</label>
                    <input type="text" name="username" class="form-input" required placeholder="建议使用学号">
                </div>

                <div class="form-group">
                    <label class="form-label">密码</label>
                    <input type="password" name="password" class="form-input" required placeholder="6位以上字符">
                </div>

                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" name="nickname" class="form-input" required placeholder="大家怎么称呼你">
                </div>

                <div class="flex gap-4">
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">学号</label>
                        <input type="text" name="studentId" class="form-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="form-label">校区</label>
                        <select name="campus" class="form-select">
                            <option value="东校区">东校区</option>
                            <option value="西校区">西校区</option>
                            <option value="南校区">南校区</option>
                            <option value="北校区">北校区</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">手机号</label>
                    <input type="tel" name="phone" class="form-input" placeholder="用于联系交易 (选填)">
                </div>

                <button type="submit" class="btn btn-primary btn-block mt-4">注 册</button>
            </form>

            <div class="mt-4 text-center text-sm text-secondary">
                已有账号？ <a href="login.html" class="text-primary">去登录</a>
            </div>
        </div>
    </div>

    <script src="js/api.js?v=1.2"></script>
    <script src="js/utils.js?v=1.1"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            if (data.password.length < 6) {
                Utils.showToast('密码长度至少6位', 'error');
                return;
            }

            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '注册中...';

            try {
                await API.register(data);
                Utils.showToast('注册成功！请登录', 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);
            } catch (error) {
                Utils.showToast(error.message || '注册失败', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
