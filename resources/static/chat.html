<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能客服 - 校园二手交易平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .chat-header-info h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header-info p {
            font-size: 12px;
            opacity: 0.9;
        }

        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .message.user .message-avatar {
            background: #10b981;
            color: white;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.ai .message-content {
            background: white;
            color: #1e293b;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.time {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 4px;
            justify-content: flex-start;
            padding-left: 46px;
        }

        .message.user.time {
            flex-direction: row-reverse;
            padding-left: 0;
            padding-right: 46px;
        }

        .chat-input-area {
            padding: 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #667eea;
        }

        .chat-send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .chat-send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .chat-send-btn:active {
            transform: translateY(0);
        }

        .quick-questions {
            padding: 12px 16px;
            background: #f1f5f9;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-btn {
            padding: 6px 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            font-size: 12px;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        .back-link {
            display: block;
            text-align: center;
            padding: 12px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            background: white;
        }

        .back-link:hover {
            color: #667eea;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #94a3b8;
            font-size: 14px;
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .suggestions {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-header-icon">🤖</div>
            <div class="chat-header-info">
                <h2>AI智能客服</h2>
                <p>7x24小时为您服务</p>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message ai">
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    您好！我是校园二手交易平台的AI智能客服 👋<br><br>
                    我可以帮您解答关于订单、付款、发货、退款、商品发布等问题。<br><br>
                    请直接在下方输入您的问题！
                    <div class="suggestions">💡 您可以问我：怎么付款？如何退款？订单在哪里？</div>
                </div>
            </div>
        </div>

        <div class="quick-questions">
            <button class="quick-btn" onclick="sendQuickMessage('怎么付款')">怎么付款</button>
            <button class="quick-btn" onclick="sendQuickMessage('如何退款')">如何退款</button>
            <button class="quick-btn" onclick="sendQuickMessage('订单在哪里')">订单在哪里</button>
            <button class="quick-btn" onclick="sendQuickMessage('如何发布商品')">如何发布</button>
            <button class="quick-btn" onclick="sendQuickMessage('取消订单')">取消订单</button>
            <button class="quick-btn" onclick="sendQuickMessage('发货时间')">发货时间</button>
        </div>

        <div class="chat-input-area">
            <input type="text" class="chat-input" id="chatInput" placeholder="请输入您的问题..." onkeypress="handleKeyPress(event)">
            <button class="chat-send-btn" onclick="sendMessage()">发送</button>
        </div>

        <a href="xyx_index.html" class="back-link">← 返回首页</a>
    </div>

    <script src="js/api.js?v=1.3"></script>
    <script>
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function sendQuickMessage(msg) {
            document.getElementById('chatInput').value = msg;
            sendMessage();
        }

        async function sendMessage() {
            const msg = chatInput.value.trim();
            if (!msg) return;

            addMessage(msg, 'user');
            chatInput.value = '';

            addLoadingMessage();

            try {
                const res = await API.aiChat(msg);
                removeLoadingMessage();

                if (res.data && res.data.answer) {
                    addMessage(res.data.answer, 'ai');
                } else {
                    addMessage('抱歉，我现在无法回答您的问题，请稍后再试。', 'ai');
                }
            } catch (e) {
                removeLoadingMessage();
                console.error('AI Chat Error:', e);
                addMessage('抱歉，服务暂时不可用，请稍后再试。', 'ai');
            }

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(content, type) {
            const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `
                <div class="message-avatar">${type === 'ai' ? '🤖' : '👤'}</div>
                <div class="message-content">${content.replace(/\n/g, '<br>')}</div>
            `;
            chatMessages.appendChild(messageDiv);

            const timeDiv = document.createElement('div');
            timeDiv.className = `message time ${type}`;
            timeDiv.textContent = time;
            chatMessages.appendChild(timeDiv);

            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addLoadingMessage() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.id = 'loadingMessage';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🤖</div>
                <div class="message-content">
                    <div class="loading">
                        <span>正在思考</span>
                        <div class="loading-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function removeLoadingMessage() {
            const loading = document.getElementById('loadingMessage');
            if (loading) {
                loading.remove();
            }
        }

        chatInput.focus();
    </script>
</body>
</html>
