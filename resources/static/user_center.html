<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 校园二手交易平台</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .uc-container {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            min-height: 600px;
        }

        .sidebar {
            width: 250px;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            background: white;
            padding: 2rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .menu-item {
            display: block;
            padding: 1rem;
            background: white;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .menu-item:first-child {
            border-top-left-radius: var(--radius-lg);
            border-top-right-radius: var(--radius-lg);
        }

        .menu-item:last-child {
            border-bottom-left-radius: var(--radius-lg);
            border-bottom-right-radius: var(--radius-lg);
            border-bottom: none;
        }

        .menu-item:hover {
            background-color: #f9fafb;
            color: var(--primary-color);
        }

        .menu-item.active {
            background-color: var(--primary-color);
            color: white;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        .profile-header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-color);
            transition: filter 0.2s;
        }

        .avatar-container {
            position: relative;
            width: 80px;
            height: 80px;
            flex-shrink: 0;
            user-select: none;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.75rem;
            text-align: center;
            padding: 5px;
            opacity: 0;
            cursor: pointer;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .avatar-container.editable .avatar-overlay {
            pointer-events: auto;
        }

        .avatar-container.editable:hover .avatar-overlay {
            opacity: 1;
        }

        .order-item,
        .product-item {
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: var(--radius-md);
            background: #eee;
        }

        .item-status {
            margin-left: auto;
            font-weight: bold;
        }

        .status-0 {
            color: var(--accent-color);
        }

        /* Pending */
        .status-1 {
            color: var(--primary-color);
        }

        /* Shipped */
        .status-3 {
            color: var(--secondary-color);
        }

        /* Completed */

        /* Star Rating */
        .stars {
            display: flex;
            gap: 0.5rem;
            flex-direction: row-reverse;
            justify-content: flex-end;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 1.5rem;
            color: #ddd;
            cursor: pointer;
            transition: color 0.1s;
        }

        .stars label:hover,
        .stars label:hover~label,
        .stars input:checked~label {
            color: var(--accent-color);
        }

        .stars label:active {
            transform: scale(0.9);
        }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="container nav-container flex items-center justify-between">
            <a href="xyx_index.html" class="nav-brand">
                <img src="images/logo.png" style="height:32px; width:32px;" alt="Logo">
                <span>校园二手</span>
            </a>
            <div class="nav-links items-center">
                <a href="xyx_index.html" class="nav-link">返回首页</a>
                <button onclick="if(confirm('确定要退出登录吗？')){TokenManager.removeToken();localStorage.removeItem('token');localStorage.removeItem('user');window.location.href='login.html';}" class="btn btn-secondary text-sm">退出登录</button>
            </div>
        </div>
    </nav>

    <main class="container uc-container mb-4">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="shadow-sm">
                <div class="menu-item active" onclick="switchTab('profile')">个人资料</div>
                <div class="menu-item" onclick="switchTab('orders')">我的订单</div>
                <div class="menu-item" onclick="switchTab('products')">我发布的</div>
                <div class="menu-item" onclick="switchTab('favorites')">我的收藏</div>
                <div class="menu-item" onclick="switchTab('reviews')">评价管理</div>
                <div id="adminEntry" class="menu-item" onclick="location.href='xyx_admin.html'"
                    style="display: none; border-top: 1px solid var(--border-color); color: var(--accent-color); font-weight: bold;">
                    管理员后台</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">

            <!-- Profile Tab -->
            <div id="tab-profile" class="tab-pane active">
                <h2 class="text-xl mb-4">个人资料</h2>
                <div class="profile-header">
                    <div id="avatarContainer" class="avatar-container"
                        onclick="document.getElementById('avatarFileInput').click()">
                        <img id="avatarImg" src="images/logo.png" class="profile-avatar"
                            onerror="this.onerror=null;this.src='images/avatar_placeholder.png'">
                        <div class="avatar-overlay">更换头像</div>
                        <input type="file" id="avatarFileInput" hidden accept="image/*" onchange="uploadAvatar(event)">
                    </div>
                    <div>
                        <h3 class="text-lg" id="nicknameDisplay">User</h3>
                        <p class="text-secondary" id="uidDisplay">ID: --</p>
                    </div>
                </div>


                <div class="form-group">
                    <label class="form-label">昵称</label>
                    <input type="text" id="nicknameInput" class="form-input" disabled value="">
                </div>
                <!-- studentId is typically immutable, keep disabled or allow if needed. keeping disabled for safety -->
                <div class="form-group">
                    <label class="form-label">学号</label>
                    <input type="text" id="studentId" class="form-input" disabled value="...">
                </div>
                <div class="form-group">
                    <label class="form-label">校区</label>
                    <input type="text" id="campus" class="form-input" disabled value="...">
                </div>
                <div class="form-group">
                    <label class="form-label">联系电话</label>
                    <input type="text" id="phone" class="form-input" disabled value="...">
                </div>

                <div class="mt-4 flex gap-2">
                    <button id="btnEditProfile" class="btn btn-secondary" onclick="enableEditProfile()">修改资料</button>
                    <button id="btnSaveProfile" class="btn btn-primary hidden" onclick="saveUserInfo()">保存修改</button>
                    <button id="btnCancelEdit" class="btn btn-secondary hidden"
                        onclick="cancelEditProfile()">取消</button>
                </div>
            </div>

            <!-- Orders Tab -->
            <div id="tab-orders" class="tab-pane">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl">我的订单</h2>
                    <div class="flex gap-2">
                        <select onchange="loadOrders(this.value)" class="form-select"
                            style="width: auto; padding: 0.25rem;">
                            <option value="">全部</option>
                            <option value="buy">我买的</option>
                            <option value="sell">我卖的</option>
                        </select>
                    </div>
                </div>
                <div id="ordersList"> 加载中... </div>
            </div>

            <!-- Products Tab -->
            <div id="tab-products" class="tab-pane">
                <h2 class="text-xl mb-4">我发布的商品</h2>
                <div id="productsList"> 加载中... </div>
            </div>

            <!-- Favorites Tab -->
            <div id="tab-favorites" class="tab-pane">
                <h2 class="text-xl mb-4">我的收藏</h2>
                <div id="favoritesList"> 加载中... </div>
            </div>

            <!-- Reviews Tab -->
            <div id="tab-reviews" class="tab-pane">
                <h2 class="text-xl mb-4">评价管理</h2>
                <div class="flex gap-2 mb-4">
                    <button class="btn btn-primary text-sm" onclick="loadReviews('received')">我收到的</button>
                    <button class="btn btn-secondary text-sm" onclick="loadReviews('given')">我发出的</button>
                </div>
                <div id="reviewsList"> 加载中... </div>
            </div>
        </div>
    </main>

    <!-- Review Modal Container -->
    <div id="reviewModal" class="hidden"
        style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:1000;display:flex;">
        <div class="card p-4" style="width: 450px; padding: 2.5rem; border-radius: 1rem; box-shadow: var(--shadow-md);">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl" id="modalTitle">评价订单</h3>
                <button onclick="closeReviewModal()" class="text-secondary hover:text-main"
                    style="font-size: 1.5rem;">&times;</button>
            </div>

            <div id="modalProductInfo" class="flex items-center gap-3 mb-6 p-3 bg-gray-50 rounded-lg"
                style="background:#f9fafb; border-radius:0.5rem;">
                <img id="modalProductImg" src="images/product_placeholder.png"
                    style="width:50px; height:50px; object-fit:cover; border-radius:0.25rem;">
                <div class="text-sm font-bold" id="modalProductTitle">商品名称</div>
            </div>

            <form id="reviewForm">
                <input type="hidden" name="orderId" id="reviewOrderId">
                <input type="hidden" name="id" id="reviewId">

                <div class="form-group">
                    <label class="form-label">评分</label>
                    <div class="stars">
                        <input type="radio" name="rating" id="star5" value="5"><label for="star5">★</label>
                        <input type="radio" name="rating" id="star4" value="4"><label for="star4">★</label>
                        <input type="radio" name="rating" id="star3" value="3"><label for="star3">★</label>
                        <input type="radio" name="rating" id="star2" value="2"><label for="star2">★</label>
                        <input type="radio" name="rating" id="star1" value="1"><label for="star1">★</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">评价内容</label>
                    <textarea name="content" class="form-textarea" rows="4" placeholder="说说你的交易感受吧..."
                        required></textarea>
                </div>

                <div class="flex gap-3 mt-8">
                    <button type="button" class="btn btn-secondary flex-1" onclick="closeReviewModal()">取消</button>
                    <button type="submit" class="btn btn-primary flex-1">提交评价</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js?v=1.3"></script>
    <script src="js/utils.js?v=1.3"></script>
    <script>
        function logout() {
            if (typeof TokenManager !== 'undefined') {
                TokenManager.removeToken();
            }
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'login.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'login.html';
                return;
            }

            loadUserInfo();

            const urlTab = Utils.getQueryParam('tab');
            if (urlTab) switchTab(urlTab);
        });

        let currentAvatarUrl = null;

        function switchTab(tabName) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            // Find the item with the matching tab name
            const item = Array.from(document.querySelectorAll('.menu-item')).find(el => el.getAttribute('onclick')?.includes(`'${tabName}'`));
            if (item) item.classList.add('active');

            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            const pane = document.getElementById(`tab-${tabName}`);
            if (pane) pane.classList.add('active');

            if (tabName === 'orders') loadOrders();
            if (tabName === 'products') loadMyProducts();
            if (tabName === 'favorites') loadFavorites();
            if (tabName === 'reviews') loadReviews('received');
        }

        async function loadUserInfo() {
            try {
                const res = await API.getUserInfo();
                const user = res.data;
                TokenManager.setUser(user);

                if (user) {
                    document.getElementById('nicknameDisplay').textContent = user.nickname;
                    document.getElementById('uidDisplay').textContent = `ID: ${user.id}`;
                    document.getElementById('nicknameInput').value = user.nickname || '';
                    document.getElementById('studentId').value = user.studentId || '';
                    document.getElementById('campus').value = user.campus || '';
                    document.getElementById('phone').value = user.phone || '';
                    if (user.avatarUrl) {
                        currentAvatarUrl = user.avatarUrl;
                        document.getElementById('avatarImg').src = Utils.getImgUrl(user.avatarUrl);
                    }

                    // Show admin entry if role is ADMIN
                    if (user.role === 'ADMIN') {
                        document.getElementById('adminEntry').style.display = 'block';
                    }
                }
            } catch (e) { console.error(e); }
        }

        // Profile Edit Functions
        function enableEditProfile() {
            document.getElementById('nicknameInput').disabled = false;
            document.getElementById('studentId').disabled = false;
            document.getElementById('campus').disabled = false;
            document.getElementById('phone').disabled = false;
            document.getElementById('avatarContainer').classList.add('editable');

            document.getElementById('btnEditProfile').classList.add('hidden');
            document.getElementById('btnSaveProfile').classList.remove('hidden');
            document.getElementById('btnCancelEdit').classList.remove('hidden');
        }

        function cancelEditProfile() {
            document.getElementById('nicknameInput').disabled = true;
            document.getElementById('studentId').disabled = true;
            document.getElementById('campus').disabled = true;
            document.getElementById('phone').disabled = true;
            document.getElementById('avatarContainer').classList.remove('editable');

            document.getElementById('btnEditProfile').classList.remove('hidden');
            document.getElementById('btnSaveProfile').classList.add('hidden');
            document.getElementById('btnCancelEdit').classList.add('hidden');
            loadUserInfo(); // Reset values
        }

        async function saveUserInfo() {
            const phone = document.getElementById('phone').value.trim();
            // 前端手机号格式校验
            if (phone) {
                const phoneRegex = /^1[3-9]\d{9}$/;
                if (!phoneRegex.test(phone)) {
                    Utils.showToast('手机号格式不正确，请输入11位有效手机号', 'error');
                    return;
                }
            }

            const data = {
                nickname: document.getElementById('nicknameInput').value,
                studentId: document.getElementById('studentId').value,
                campus: document.getElementById('campus').value,
                phone: phone || null,
                avatarUrl: currentAvatarUrl
            };

            try {
                await API.updateUser(data);
                Utils.showToast('个人资料更新成功', 'success');
                cancelEditProfile();
                loadUserInfo();
            } catch (e) {
                Utils.showToast(e.message || '更新失败', 'error');
            }
        }

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Only allow upload when in editable mode
            if (!document.getElementById('avatarContainer').classList.contains('editable')) return;

            try {
                Utils.showToast('正在上传头像...', 'info');
                const res = await API.uploadFile(file);
                currentAvatarUrl = res.data;
                document.getElementById('avatarImg').src = Utils.getImgUrl(currentAvatarUrl);
                Utils.showToast('头像上传成功，请保存修改', 'success');
            } catch (e) {
                Utils.showToast('上传失败: ' + e.message, 'error');
            }
        }
        async function loadOrders(type = 'all') {
            const container = document.getElementById('ordersList');
            container.innerHTML = '<p class="text-secondary">加载中...</p>';
            try {
                const res = await API.getMyOrders({ type: type, pageNum: 1, pageSize: 20 });
                const list = res.data.list || [];

                if (list.length === 0) {
                    container.innerHTML = '<p class="text-secondary">暂无订单</p>';
                    return;
                }

                container.innerHTML = '';
                list.forEach(order => {
                    const statusMap = { 0: '待付款', 1: '待发货', 2: '待收货', 3: '已完成', 4: '已取消' };
                    // Determine role
                    // Logic to check if I am buyer or seller is tricky if backend doesn't explicit it in order object.
                    // But we used type filter.

                    let orderImg = Utils.getImgUrl(order.product?.coverImage);

                    const item = document.createElement('div');
                    item.className = 'order-item';
                    item.innerHTML = `
                        <img src="${orderImg}" class="item-img" onerror="this.onerror=null;this.src='images/product_placeholder.png'">
                        <div style="flex:1;">
                            <div class="flex justify-between">
                                <span class="font-bold text-sm">订单号: ${order.orderNo}</span>
                                <span class="text-xs text-secondary">${Utils.formatDate(order.updateTime || order.createTime)}</span>
                            </div>
                            <div class="text-sm mt-1">${order.product?.title || '未知商品'}</div>
                            <div class="text-danger font-bold mt-1">${Utils.formatPrice(order.totalAmount)}</div>
                        </div>
                        <div class="flex flex-col items-end gap-2">
                             <span class="status-${order.status} font-bold text-sm">${statusMap[order.status] || '未知'}</span>
                             ${getActionButtons(order, type)}
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = `<p class="text-danger">加载失败: ${e.message}</p>`;
            }
        }

        function getActionButtons(order, type) {
            let html = '';
            // Pay Now (Buyer only, status 0)
            if (type === 'buy' && order.status === 0) {
                html += `<button class="btn btn-accent text-sm padding-xs" onclick="payOrder('${order.id}')">去支付</button>`;
            }
            // Confirm Receipt (Buyer only, status 1 or 2)
            if (type === 'buy' && (order.status === 1 || order.status === 2)) {
                html += `<button class="btn btn-primary text-sm padding-xs" onclick="confirmReceipt('${order.id}')">确认收货</button>`;
            }
            // Cancel Order (Buyer only, status 0 or 1)
            if (type === 'buy' && (order.status === 0 || order.status === 1)) {
                html += `<button class="btn btn-secondary text-sm padding-xs" onclick="cancelOrder('${order.id}')">取消订单</button>`;
            }
            // Review (Buyer only, status 3)
            if (type === 'buy' && order.status === 3) {
                const productTitle = order.product?.title || '商品';
                const productImg = Utils.getImgUrl(order.product?.coverImage);
                // Add surrounding quotes to string arguments
                html += `<button class="btn btn-secondary text-sm" onclick='openReviewModal("${order.id}", null, "${productTitle.replace(/"/g, "&quot;")}", "${productImg}")'>评价</button>`;
            }
            return html;
        }

        async function payOrder(id) {
            if (confirm('确认支付该订单吗？')) {
                try {
                    await API.payOrder(id);
                    Utils.showToast('支付成功', 'success');
                    loadOrders();
                } catch (e) {
                    Utils.showToast(e.message || '支付失败', 'error');
                }
            }
        }

        async function confirmReceipt(id) {
            if (confirm('确认收到货物了吗？')) {
                try {
                    await API.confirmReceipt(id);
                    Utils.showToast('确认收货成功', 'success');
                    loadOrders();
                } catch (e) {
                    Utils.showToast('操作失败', 'error');
                }
            }
        }

        async function cancelOrder(id) {
            const reason = prompt('请输入取消原因（可选）：');
            if (reason === null) return; // User clicked Cancel in prompt

            if (confirm('确定要取消该订单吗？')) {
                try {
                    await API.cancelOrder(id, reason);
                    Utils.showToast('订单已取消', 'success');
                    loadOrders();
                } catch (e) {
                    Utils.showToast(e.message || '操作失败', 'error');
                }
            }
        }



        // My Products
        async function loadMyProducts() {
            const container = document.getElementById('productsList');
            container.innerHTML = '加载中...';
            try {
                const res = await API.getMyProducts({ pageNum: 1, pageSize: 20 });
                const list = res.data.list || [];

                if (list.length === 0) {
                    container.innerHTML = '<p class="text-secondary">暂无发布</p>';
                    return;
                }

                container.innerHTML = '';
                list.forEach(p => {
                    let pImg = Utils.getImgUrl(p.coverImage);

                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <img src="${pImg}" class="item-img" onerror="this.onerror=null;this.src='images/product_placeholder.png'">
                        <div style="flex:1;">
                            <div class="font-bold">${p.title}</div>
                            <div class="text-danger">${Utils.formatPrice(p.price)}</div>
                             <div class="text-sm text-secondary">状态: ${parseInt(p.status) === 1 ? '上架中' : (parseInt(p.status) === 0 ? '已下架' : '已售出')}</div>
                        </div>
                        <div class="flex gap-2">
                            ${parseInt(p.status) === 1 ?
                            `<button class="btn btn-secondary text-sm" onclick="updateStatus('${p.id}', 0)">下架</button>` :
                            (parseInt(p.status) === 0 ? `<button class="btn btn-primary text-sm" onclick="updateStatus('${p.id}', 1)">上架</button>` : '')
                        }
                        </div>
                    `;
                    container.appendChild(item);
                });

            } catch (e) {
                container.innerHTML = '加载失败';
            }
        }

        async function updateStatus(id, status) {
            try {
                await API.updateProductStatus(id, status);
                Utils.showToast('状态更新成功', 'success');
                loadMyProducts();
            } catch (e) { Utils.showToast(e.message, 'error'); }
        }

        // Reviews
        async function loadReviews(type = 'received') {
            const container = document.getElementById('reviewsList');
            container.innerHTML = '加载中...';
            const user = TokenManager.getUser();
            if (!user) return;

            const params = { pageNum: 1, pageSize: 20 };
            if (type === 'received') params.targetId = user.id;
            else params.reviewerId = user.id;

            try {
                const res = await API.getReviews(params);
                const list = res.data.list || [];

                if (list.length === 0) {
                    container.innerHTML = '<p class="text-secondary">暂无评价</p>';
                    return;
                }

                container.innerHTML = '';
                for (const r of list) {
                    const item = document.createElement('div');
                    item.className = 'card p-4 mb-2';

                    let targetInfo = `用户 ${r.targetId}`;
                    if (type === 'given') {
                        try {
                            const uRes = await API.getUserById(r.targetId);
                            if (uRes.data) targetInfo = uRes.data.nickname || uRes.data.username;
                        } catch (e) { }
                    }

                    item.innerHTML = `
                        <div class="flex justify-between items-center mb-2">
                             <div class="font-bold text-sm">
                                 ${type === 'received' ? '来自: ' + (r.reviewer?.nickname || '用户') : '发给: ' + targetInfo}
                             </div>
                             <div class="text-accent">★ ${r.rating}</div>
                        </div>
                        <div class="text-sm">${r.content}</div>
                        <!-- 管理员回复列表展示（支持多条回复） -->
                        ${r.replyList && r.replyList.length > 0 ? `
                        <div class="reply-list mt-2">
                            ${r.replyList.map(reply => `
                            <div class="admin-reply p-3 bg-blue-50 border-l-4 border-blue-400 rounded mb-2">
                                <div class="flex justify-between items-center mb-1">
                                    <span class="text-blue-600 font-bold text-sm">管理员回复</span>
                                    <span class="text-xs text-gray-500">${Utils.formatDate(reply.createTime)}</span>
                                </div>
                                <div class="text-sm">${reply.content}</div>
                            </div>
                            `).join('')}
                        </div>
                        ` : ''}
                        <div class="flex justify-between items-center mt-2">
                            <div class="text-xs text-secondary">${Utils.formatDate(r.updateTime || r.createTime)}</div>
                            ${type === 'given' ? `
                            <div class="flex gap-2">
                                <button class="btn btn-secondary text-sm padding-xs" onclick='openReviewModal(null, ${JSON.stringify(r).replace(/'/g, "&apos;")})'>修改</button>
                                <button class="btn btn-danger text-sm padding-xs" onclick="deleteReview('${r.id}')">删除</button>
                            </div>
                            ` : ''}
                        </div>
                    `;
                    container.appendChild(item);
                }
            } catch (e) {
                container.innerHTML = `<p class="text-danger">加载失败: ${e.message}</p>`;
            }
        }

        // Review Modal Internal
        function openReviewModal(orderId, reviewData = null, title = '', img = '') {
            const modal = document.getElementById('reviewModal');
            const form = document.getElementById('reviewForm');
            form.reset();

            if (reviewData) {
                // Edit mode
                document.getElementById('reviewOrderId').value = reviewData.orderId || '';
                document.getElementById('reviewId').value = reviewData.id;
                // Set radio
                const radio = form.querySelector(`input[name="rating"][value="${reviewData.rating}"]`);
                if (radio) radio.checked = true;
                form.content.value = reviewData.content;

                document.getElementById('modalTitle').textContent = '修改评价';
                document.getElementById('modalProductInfo').style.display = 'none';
            } else {
                // Create mode
                document.getElementById('reviewOrderId').value = orderId;
                document.getElementById('reviewId').value = '';
                document.getElementById('modalTitle').textContent = '评价订单';
                document.getElementById('modalProductTitle').textContent = title;
                document.getElementById('modalProductImg').src = img || 'images/product_placeholder.png';
                document.getElementById('modalProductInfo').style.display = 'flex';
            }
            modal.classList.remove('hidden');
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').classList.add('hidden');
        }

        async function deleteReview(id) {
            if (confirm('确定要删除这条评价吗？')) {
                try {
                    await API.deleteReview(id);
                    Utils.showToast('删除成功', 'success');
                    loadReviews('given');
                } catch (e) {
                    Utils.showToast(e.message, 'error');
                }
            }
        }

        document.getElementById('reviewForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            
            // 手动验证评分是否已选择
            if (!data.rating) {
                Utils.showToast('请选择评分', 'error');
                return;
            }
            
            // Need to handle null orderId if passing empty string from hidden input?
            // parseInt('') is NaN.
            if (data.orderId) data.orderId = data.orderId; // Keep as string or parse? IDs should be string in JS if possible
            // ... API expects Long? JSON stringify handles number/string. 
            // Better to keep as is, or parseInt if safe. 
            // But we established IDs might be huge.
            // If backend expects Long, strings usually work in JSON if Jackson is configured, or if it's just a number.
            // BUT `onclick` passed string.
            // form hidden input value is string.

            data.rating = parseInt(data.rating);
            const reviewIdValue = document.getElementById('reviewId').value;

            try {
                if (reviewIdValue) {
                    // 修改模式：保留 id，移除 orderId (后端 UpdateReviewRequest 不收 orderId)
                    data.id = reviewIdValue;
                    delete data.orderId;
                    await API.updateReview(data);
                    Utils.showToast('修改成功', 'success');
                } else {
                    // 创建模式：移除 id (后端 CreateReviewRequest 不收 id)
                    delete data.id;
                    await API.createReview(data);
                    Utils.showToast('评价成功', 'success');
                }
                closeReviewModal();
                switchTab('reviews');
            } catch (e) {
                Utils.showToast(e.message, 'error');
            }
        });

        async function loadFavorites() {
            const container = document.getElementById('favoritesList');
            container.innerHTML = '加载中...';
            try {
                const res = await API.getFavorites({ pageNum: 1, pageSize: 20 });
                const list = res.data.list || [];

                if (list.length === 0) {
                    container.innerHTML = '<p class="text-secondary">暂无收藏</p>';
                    return;
                }

                container.innerHTML = '';
                list.forEach(p => {
                    let pImg = Utils.getImgUrl(p.coverImage);

                    const item = document.createElement('div');
                    item.className = 'product-item';
                    item.innerHTML = `
                        <img src="${pImg}" class="item-img" onclick="location.href='product_detail.html?id=${p.id}'" style="cursor:pointer;" onerror="this.onerror=null;this.src='images/product_placeholder.png'">
                        <div style="flex:1;">
                            <div class="font-bold cursor-pointer" onclick="location.href='product_detail.html?id=${p.id}'">${p.title}</div>
                            <div class="text-danger">${Utils.formatPrice(p.price)}</div>
                             <div class="text-sm text-secondary">${p.campus || ''}</div>
                        </div>
                        <div class="flex gap-2">
                             <button class="btn btn-secondary text-sm" onclick="toggleFavoriteInList('${p.id}')">取消收藏</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (e) {
                container.innerHTML = '加载失败: ' + e.message;
            }
        }

        async function toggleFavoriteInList(id) {
            if (confirm('确定要取消收藏吗？')) {
                try {
                    await API.toggleFavorite(id);
                    Utils.showToast('已取消收藏', 'success');
                    loadFavorites();
                } catch (e) {
                    Utils.showToast(e.message, 'error');
                }
            }
        }

        function logout() {
            TokenManager.removeToken();
            window.location.href = 'login.html';
        }
    </script>
</body>

</html>
